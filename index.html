<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idioms on Communication - Ms Ngoc Hai FTU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-bg-1: #8854C0;
            --primary-bg-2: #FDCB6E;
            --primary-bg-3: #00C9A7;
            --primary-bg-4: #FF7675;
            --correct-color: #00D26A;
            --correct-shadow: #00A352;
            --wrong-color: #FF4757;
            --wrong-shadow: #D63031;
            --selected-color: #6C5CE7;
            --selected-shadow: #4834D4;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #2D3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #FF7675, #6C5CE7);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
            padding: 20px 10px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><text x="15" y="35" font-size="22" opacity="0.3">⭐</text><text x="75" y="25" font-size="24" opacity="0.3">🌸</text><text x="95" y="85" font-size="20" opacity="0.3">🍓</text><text x="25" y="95" font-size="24" opacity="0.3">🐱</text><text x="60" y="60" font-size="22" opacity="0.3">☁️</text></svg>');
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 840px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 18px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            border: 3px solid #FFF;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 900;
            color: #6C5CE7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .teacher-tag {
            font-size: 0.8rem;
            font-weight: 800;
            color: #D63031;
            background: #FFEAA7;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            border: 2px solid #FDCB6E;
            margin-top: 3px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFF;
            padding: 10px 18px;
            border-radius: 16px;
            box-shadow: 0 5px 0px #DFE6E9;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .progress-container {
            flex-grow: 1;
            margin: 0 15px;
            background: #DFE6E9;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00C9A7, #00D26A);
            border-radius: 10px;
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .filter-bar {
            display: none;
            gap: 10px;
            justify-content: center;
        }

        .filter-bar.active {
            display: flex;
        }

        .filter-btn {
            background: #FFF;
            border: 3px solid #CBD5E1;
            border-bottom: 5px solid #94A3B8;
            border-radius: 14px;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn.active {
            background: #6C5CE7;
            border-color: #6C5CE7;
            border-bottom-color: #4834D4;
            color: #FFF;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #FFF;
            transition: transform 0.2s, opacity 0.3s;
        }

        .question-card.hidden {
            display: none;
        }

        .card-header-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .question-number {
            font-size: 0.9rem;
            font-weight: 800;
            color: #0984E3;
            background: #E1F5FE;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .status-badge {
            display: none;
            font-size: 0.82rem;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .status-badge.correct {
            display: inline-block;
            background: #D1FAE5;
            color: #059669;
        }

        .status-badge.wrong {
            display: inline-block;
            background: #FEE2E2;
            color: #DC2626;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #2D3436;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        /* CSS components for Q29 & Q30 */
        .sale-sign-box {
            background: #FF7675;
            color: #FFF;
            padding: 12px;
            border-radius: 12px;
            border: 3px dashed #FFF;
            text-align: center;
            font-weight: 900;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(255, 118, 117, 0.4);
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }

        .phone-message-box {
            background: #E8F5E9;
            border: 2px solid #00C9A7;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 201, 167, 0.15);
        }

        .phone-icon {
            font-size: 1.8rem;
        }

        .phone-text {
            font-size: 0.95rem;
            font-weight: 800;
            color: #059669;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 3px solid #E2E8F0;
            border-bottom: 6px solid #CBD5E1;
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 1rem;
            font-weight: 800;
            color: #475569;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            outline: none;
        }

        .option-btn:hover:not(.locked) {
            transform: translateY(-2px);
            border-color: #A7F3D0;
            background: #F0FDF4;
        }

        .option-btn:active:not(.locked) {
            transform: translateY(2px);
            border-bottom-width: 3px;
        }

        .option-prefix {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #F1F5F9;
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .option-btn.selected {
            background-color: var(--selected-color) !important;
            border-color: var(--selected-color) !important;
            border-bottom-color: var(--selected-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.selected .option-prefix {
            background: rgba(255, 255, 255, 0.3);
            color: #FFF;
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            border-color: var(--correct-color) !important;
            border-bottom-color: var(--correct-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.correct .option-prefix {
            background: rgba(255, 255, 255, 0.3);
            color: #FFF;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            border-color: var(--wrong-color) !important;
            border-bottom-color: var(--wrong-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.wrong .option-prefix {
            background: rgba(255, 255, 255, 0.3);
            color: #FFF;
        }

        .explanation-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #F0FDF4;
            border: 2px dashed #00C9A7;
            border-radius: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-title {
            font-size: 1rem;
            font-weight: 900;
            color: #059669;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            border-bottom: 2px solid #A7F3D0;
            padding-bottom: 4px;
        }

        .exp-section {
            margin-bottom: 6px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .exp-section strong {
            color: #065F46;
        }

        .exp-options-list {
            list-style: none;
            margin: 4px 0;
            padding-left: 6px;
        }

        .exp-options-list li {
            margin-bottom: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .submit-btn-container {
            text-align: center;
            margin: 10px 0 30px;
        }

        .submit-btn {
            background: linear-gradient(180deg, #FF7675 0%, #D63031 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 14px 34px;
            border: none;
            border-radius: 22px;
            box-shadow: 0 7px 0 #B22222, 0 10px 18px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 0 #B22222, 0 12px 22px rgba(0,0,0,0.25);
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #B22222, 0 5px 8px rgba(0,0,0,0.2);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-card {
            background: #FFF;
            border-radius: 26px;
            padding: 28px 18px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 6px solid #FDCB6E;
        }

        .modal-icon {
            font-size: 3.5rem;
            margin-bottom: 6px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: #6C5CE7;
            margin-bottom: 6px;
        }

        .score-display {
            font-size: 2.6rem;
            font-weight: 900;
            color: #00C9A7;
            margin: 8px 0;
        }

        .feedback-text {
            font-size: 1rem;
            font-weight: 700;
            color: #2D3436;
            margin-bottom: 18px;
            line-height: 1.45;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }

        .btn-view-all {
            background: #00C9A7;
            color: #FFF;
            box-shadow: 0 4px 0 #00A352;
        }

        .btn-view-wrong {
            background: #FF7675;
            color: #FFF;
            box-shadow: 0 4px 0 #D63031;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Idioms on Communication - 30 Practice Questions</h1>
            <div class="teacher-tag">Giáo viên tạo: Ms Ngoc Hai FTU</div>
        </header>

        <div class="stats-bar">
            <span id="statsLabel">📝 Tiến độ làm bài</span>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span id="progressText">0/30</span>
        </div>

        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" id="btnFilterAll" onclick="filterQuestionsResult('all')">👁️ Xem tất cả (30 câu)</button>
            <button class="filter-btn" id="btnFilterWrong" onclick="filterQuestionsResult('wrong')">❌ Chỉ xem câu sai (<span id="wrongCount">0</span>)</button>
        </div>

        <div id="quizContainer"></div>

        <div class="submit-btn-container" id="submitContainer">
            <button class="submit-btn" id="submitBtn">🎉 Nộp Bài & Chấm Điểm</button>
        </div>
    </div>

    <!-- Modal Popup Score -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-card">
            <div class="modal-icon" id="modalIcon">🏆</div>
            <div class="modal-title" id="modalTitle">Hoàn thành bài thi!</div>
            <div class="score-display" id="scoreDisplay">0/30</div>
            <div class="feedback-text" id="feedbackText">Tuyệt vời!</div>
            <div class="modal-actions">
                <button class="modal-btn btn-view-wrong" onclick="reviewWrongAnswers()">🔍 Xem các câu làm sai</button>
                <button class="modal-btn btn-view-all" onclick="reviewAllAnswers()">📖 Xem toàn bộ bài giải</button>
            </div>
        </div>
    </div>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                if (type === 'correct') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(250, now + 0.12);
                    osc.frequency.setValueAtTime(200, now + 0.24);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(now + 0.4);
                }
            } catch (e) {
                console.log("Audio API not supported");
            }
        }

        const rawQuestionsData = [
            {
                q: "Nobody trusts Peter with confidential information because he has such a ______ mouth.",
                options: ["big", "wide", "large", "loud"],
                answer: "big",
                exp: {
                    translations: [
                        "A. big (adj trong 'big mouth'): kẻ lắm mồm, hay bép xép làm lộ bí mật",
                        "B. wide: rộng",
                        "C. large: to lớn",
                        "D. loud: ồn ào"
                    ],
                    sentenceTrans: "Không ai tin tưởng giao thông tin bảo mật cho Peter vì anh ta là một kẻ rất lắm mồm bép xép.",
                    whyCorrect: "Chọn A vì thành ngữ 'big mouth' dùng để chỉ trích người chuyên nói những điều không nên nói hoặc tiết lộ bí mật của người khác.",
                    whyWrong: "B, C, D không tạo thành ngữ chuẩn chỉ người bép xép trong tiếng Anh."
                }
            },
            {
                q: "After weeks of denying his involvement in the financial scandal, the manager finally decided to come ______ about the fraud.",
                options: ["clean", "clear", "pure", "honest"],
                answer: "clean",
                exp: {
                    translations: [
                        "A. clean (trong 'come clean about sth'): thú nhận toàn bộ sự thật mà mình đã che giấu",
                        "B. clear: rõ ràng",
                        "C. pure: thuần khiết",
                        "D. honest: trung thực"
                    ],
                    sentenceTrans: "Sau nhiều tuần phủ nhận sự liên quan đến vụ bê bối tài chính, người quản lý cuối cùng đã quyết định thú nhận toàn bộ sự thật về vụ gian lận.",
                    whyCorrect: "Chọn A vì thành ngữ 'come clean (about sth)' có nghĩa là kể hết sự thật về điều gì đó mà bản thân đã giữ kín bấy lâu nay.",
                    whyWrong: "B, C, D không kết hợp với 'come' để tạo thành ngữ mang nghĩa thú nhận sự thật bị giấu kín."
                }
            },
            {
                q: "I wasn't able to understand all his technical jargon, but I managed to catch his ______.",
                options: ["drift", "flow", "wind", "wave"],
                answer: "drift",
                exp: {
                    translations: [
                        "A. drift (n trong 'catch/get sb's drift'): hiểu được ý cơ bản, nắm được đại ý",
                        "B. flow: dòng chảy",
                        "C. wind: cơn gió",
                        "D. wave: làn sóng"
                    ],
                    sentenceTrans: "Tôi không hiểu hết được các thuật ngữ kỹ thuật của anh ấy, nhưng tôi vẫn nắm được đại ý những gì anh ấy muốn nói.",
                    whyCorrect: "Chọn A vì thành ngữ 'catch/get sb's drift' mang nghĩa hiểu được ý niệm cơ bản hoặc đại ý mà người nói muốn truyền tải.",
                    whyWrong: "B, C, D không nằm trong thành ngữ diễn đạt việc hiểu ý người nói."
                }
            },
            {
                q: "You look anxious; talking to an experienced counselor will help you get it off your ______.",
                options: ["chest", "heart", "head", "mind"],
                answer: "chest",
                exp: {
                    translations: [
                        "A. chest (n trong 'get sth off your chest'): trút bỏ nỗi lòng, nói ra tâm sự cho nhẹ nhõm",
                        "B. heart: trái tim",
                        "C. head: cái đầu",
                        "D. mind: tâm trí"
                    ],
                    sentenceTrans: "Trông bạn có vẻ lo âu; nói chuyện với một chuyên viên tư vấn giàu kinh nghiệm sẽ giúp bạn trút bỏ được nỗi lòng cho nhẹ nhõm đấy.",
                    whyCorrect: "Chọn A vì thành ngữ 'get sth off your chest' có nghĩa là thổ lộ ra điều bấy lâu nay khiến mình trăn trở, lo âu để thấy nhẹ nhõm hơn.",
                    whyWrong: "B, C, D sai danh từ bộ phận cơ thể trong thành ngữ cố định này."
                }
            },
            {
                q: "She completely misunderstood my suggestion and got the wrong end of the ______.",
                options: ["stick", "pole", "rod", "branch"],
                answer: "stick",
                exp: {
                    translations: [
                        "A. stick (n trong 'get the wrong end of the stick'): hiểu sai bét, hiểu hoàn toàn lệch lạc vấn đề",
                        "B. pole: cây cột",
                        "C. rod: cái que",
                        "D. branch: cành cây"
                    ],
                    sentenceTrans: "Cô ấy đã hiểu lầm hoàn toàn gợi ý của tôi và hiểu sai bét toàn bộ câu chuyện.",
                    whyCorrect: "Chọn A vì thành ngữ 'get the wrong end of the stick' diễn tả việc hiểu sai hoàn toàn một sự việc hay lời nói của người khác.",
                    whyWrong: "B, C, D không tạo thành ngữ chuẩn xác trong tiếng Anh."
                }
            },
            {
                q: "I promise I will help you with your dissertation next week; I give you my ______.",
                options: ["word", "voice", "pledge", "hand"],
                answer: "word",
                exp: {
                    translations: [
                        "A. word (n trong 'give sb your word'): hứa danh dự sẽ làm gì",
                        "B. voice: giọng nói",
                        "C. pledge: lời thề",
                        "D. hand: bàn tay"
                    ],

                    sentenceTrans: "Hãy nhìn vào biển thông báo thanh lý ở trên. Biển báo nêu rõ khách hàng cần chấp thuận chính sách mà không khiếu nại, vì vậy đừng hiểu sai lệch về việc hoàn tiền.",
                    whyCorrect: "Chọn A vì thành ngữ 'get the wrong end of the stick' có nghĩa là hiểu sai hoàn toàn thông điệp hoặc quy định.",
                    whyWrong: "B, C, D không tạo thành ngữ mang nghĩa hiểu sai vấn đề."
                }
            },
            {
                q: "Look at the phone message displayed above. The manager insists that everyone must keep the project details strictly under their ______.",
                options: ["hat", "cap", "bag", "desk"],
                answer: "hat",
                hasCustomVisual: "phoneMessage",
                exp: {
                    translations: [
                        "A. hat (trong 'keep sth under your hat'): giữ bí mật tuyệt đối",
                        "B. cap: mũ lưỡi trai",
                        "C. bag: cái túi",
                        "D. desk: bàn làm việc"
                    ],
                    sentenceTrans: "Hãy nhìn vào tin nhắn điện thoại hiển thị ở trên. Người quản lý nhấn mạnh rằng mọi người phải giữ bí mật tuyệt đối các chi tiết của dự án.",
                    whyCorrect: "Chọn A vì thành ngữ 'keep sth under your hat' có nghĩa là giữ bí mật một thông tin quan trọng.",
                    whyWrong: "B, C, D không nằm trong thành ngữ giữ bí mật."
                }
            }
        ];

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let userAnswers = {};
        let shuffledQuestions = [];
        let isSubmitted = false;

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            userAnswers = {};
            isSubmitted = false;

            const shuffledRaw = shuffleArray(rawQuestionsData);

            shuffledQuestions = shuffledRaw.map((item, index) => {
                const shuffledOpts = shuffleArray(item.options);
                return {
                    ...item,
                    displayIndex: index + 1,
                    shuffledOpts: shuffledOpts
                };
            });

            shuffledQuestions.forEach((qData, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${qIndex}`;

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header-badge';

                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Câu ${qIndex + 1} / ${shuffledQuestions.length}`;

                const statusBadge = document.createElement('div');
                statusBadge.className = 'status-badge';
                statusBadge.id = `badge-${qIndex}`;

                cardHeader.appendChild(qNum);
                cardHeader.appendChild(statusBadge);

                let visualHtml = '';
                if (qData.hasCustomVisual === 'saleSign') {
                    visualHtml = `
                        <div class="sale-sign-box">
                            🏷️ MEGA CLEARANCE SALE — FINAL REBATE 50%<br>
                            <span style="font-size:0.85rem; font-weight:700;">All clearance terms are strictly final. No exchanges or refunds.</span>
                        </div>
                    `;
                } else if (qData.hasCustomVisual === 'phoneMessage') {
                    visualHtml = `
                        <div class="phone-message-box">
                            <div class="phone-icon">💬</div>
                            <div class="phone-text">
                                <strong>Message from Boss:</strong> "Team, remember to keep all project information strictly confidential until next week!"
                            </div>
                        </div>
                    `;
                }

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = visualHtml + qData.q;

                const optsGrid = document.createElement('div');
                optsGrid.className = 'options-grid';

                const prefixes = ['A', 'B', 'C', 'D'];

                qData.shuffledOpts.forEach((opt, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.id = `opt-${qIndex}-${optIdx}`;
                    btn.onclick = () => handleSelectAnswer(qIndex, opt, btn);

                    const prefix = document.createElement('span');
                    prefix.className = 'option-prefix';
                    prefix.innerText = prefixes[optIdx];

                    const textSpan = document.createElement('span');
                    textSpan.innerHTML = opt;

                    btn.appendChild(prefix);
                    btn.appendChild(textSpan);
                    optsGrid.appendChild(btn);
                });

                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `explanation-${qIndex}`;

                expBox.innerHTML = `
                    <div class="explanation-title">
                        💡 PHẦN GIẢI THÍCH CHI TIẾT (Ms Ngoc Hai FTU)
                    </div>
                    <div class="exp-section">
                        <strong>1. Phân tích từ vựng 4 đáp án:</strong>
                        <ul class="exp-options-list">
                            ${qData.exp.translations.map(t => `<li>${t}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="exp-section">
                        <strong>2. Dịch nghĩa toàn câu:</strong><br>
                        <em>"${qData.exp.sentenceTrans}"</em>
                    </div>
                    <div class="exp-section">
                        <strong>3. Tại sao chọn đáp án đúng?</strong><br>
                        ${qData.exp.whyCorrect}
                    </div>
                    <div class="exp-section">
                        <strong>4. Tại sao các đáp án còn lại chưa đúng?</strong><br>
                        ${qData.exp.whyWrong}
                    </div>
                `;

                card.appendChild(cardHeader);
                card.appendChild(qText);
                card.appendChild(optsGrid);
                card.appendChild(expBox);
                container.appendChild(card);
            });

            updateProgress();
        }

        function handleSelectAnswer(qIndex, selectedOpt, btn) {
            if (isSubmitted) return;

            const card = document.getElementById(`question-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');

            buttons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            userAnswers[qIndex] = selectedOpt;
            updateProgress();
        }

        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const total = shuffledQuestions.length;
            const pct = (answeredCount / total) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;
            document.getElementById('progressText').innerText = `${answeredCount}/${total}`;
        }

        document.getElementById('submitBtn').addEventListener('click', () => {
            const total = shuffledQuestions.length;
            const answeredCount = Object.keys(userAnswers).length;

            if (answeredCount < total) {
                const confirmSubmit = confirm(`Em mới hoàn thành ${answeredCount}/${total} câu hỏi. Em có chắc chắn muốn nộp bài ngay để chấm điểm không?`);
                if (!confirmSubmit) return;
            }

            isSubmitted = true;
            let score = 0;
            let wrongCount = 0;

            shuffledQuestions.forEach((qData, qIndex) => {
                const card = document.getElementById(`question-${qIndex}`);
                const buttons = card.querySelectorAll('.option-btn');
                const expBox = document.getElementById(`explanation-${qIndex}`);
                const badge = document.getElementById(`badge-${qIndex}`);
                const userChoice = userAnswers[qIndex];

                buttons.forEach(b => {
                    b.classList.add('locked');
                    b.style.cursor = 'default';
                });

                const isCorrect = (userChoice === qData.answer);

                if (isCorrect) {
                    score++;
                    badge.className = 'status-badge correct';
                    badge.innerText = '✓ ĐÚNG';
                    card.dataset.result = 'correct';
                } else {
                    wrongCount++;
                    badge.className = 'status-badge wrong';
                    badge.innerText = '✗ SAI';
                    card.dataset.result = 'wrong';
                }

                buttons.forEach(b => {
                    b.classList.remove('selected');
                    const textSpan = b.querySelector('span:last-child');
                    if (textSpan.innerHTML.trim() === qData.answer || textSpan.innerText.trim() === qData.answer) {
                        b.classList.add('correct');
                    } else if ((textSpan.innerHTML.trim() === userChoice || textSpan.innerText.trim() === userChoice) && !isCorrect) {
                        b.classList.add('wrong');
                    }
                });

                expBox.classList.add('active');
            });

            if (score >= total * 0.7) {
                playSound('correct');
                confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } });
            } else {
                playSound('wrong');
            }

            document.getElementById('wrongCount').innerText = wrongCount;
            document.getElementById('filterBar').classList.add('active');
            document.getElementById('statsLabel').innerText = '🎯 Kết quả kiểm tra';
            document.getElementById('submitContainer').style.display = 'none';

            document.getElementById('scoreDisplay').innerText = `${score}/${total}`;
            let feedback = "";
            let icon = "🏆";
            if (score === total) {
                feedback = "XUẤT SẮC TUYỆT ĐỐI! Em là bậc thầy làm chủ toàn bộ 30 câu Idioms on Communication! 👑✨";
                icon = "🌟";
            } else if (score >= total * 0.8) {
                feedback = "RẤT TUYỆT VỜI! Em nắm các thành ngữ giao tiếp rất vững vàng. Tiếp tục duy trì phong độ nhé! 🎉";
                icon = "🔥";
            } else if (score >= total * 0.5) {
                feedback = "KHÁ TỐT! Em đã rất nỗ lực hoàn thành bài thi 30 câu. Hãy bấm xem lại các câu sai để ghi nhớ nhé! 💪";
                icon = "👏";
            } else {
                feedback = "CỐ GẮNG THÊM NHÉ! Hãy đọc kĩ từng phần phân tích chi tiết của Ms Ngoc Hai FTU bên dưới để củng cố bài học nào! 📚";
                icon = "🌱";
            }

            document.getElementById('feedbackText').innerText = feedback;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('scoreModal').classList.add('active');
        });

        function reviewWrongAnswers() {
            document.getElementById('scoreModal').classList.remove('active');
            filterQuestionsResult('wrong');
        }

        function reviewAllAnswers() {
            document.getElementById('scoreModal').classList.remove('active');
            filterQuestionsResult('all');
        }

        function filterQuestionsResult(type) {
            const cards = document.querySelectorAll('.question-card');
            const btnAll = document.getElementById('btnFilterAll');
            const btnWrong = document.getElementById('btnFilterWrong');

            if (type === 'wrong') {
                btnWrong.classList.add('active');
                btnAll.classList.remove('active');
                cards.forEach(c => {
                    if (c.dataset.result === 'wrong') {
                        c.classList.remove('hidden');
                    } else {
                        c.classList.add('hidden');
                    }
                });
            } else {
                btnAll.classList.add('active');
                btnWrong.classList.remove('active');
                cards.forEach(c => c.classList.remove('hidden'));
            }
        }

        window.onload = () => {
            renderQuiz();
        };
    </script>
</body>
</html>
